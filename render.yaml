# Blueprint Render pour l'application "Gestion des auditoires"
# ATTENTION : PHP n'a PAS de runtime natif sur Render.
# Le déploiement utilise obligatoirement Docker (runtime: docker).
# Le Dockerfile à la racine construit l'image (Apache + PHP 8.2).
#
# BASE DE DONNÉES :
# - Les disques persistants exigent un plan PAYANT (non disponible en gratuit).
# - Le plan gratuit ne permet la persistance que via une base PostgreSQL
#   (gratuite, 1 Go, mais qui EXPIRE après 30 jours).
# - Le Blueprint ci-dessous crée la base + le service et branche
#   automatiquement DATABASE_URL.
#
# Utilisation :
#   1. Pousser ce fichier + le Dockerfile sur GitHub
#   2. Sur Render : "New +" > "Blueprint" > sélectionner le dépôt
#   OU créer manuellement un "Web Service" : Runtime = Docker,
#   puis New > PostgreSQL (Free) et coller sa connection string
#   dans la variable DATABASE_URL du service.

databases:
  - name: gestion-auditoire-db
    plan: free

services:
  - type: web
    name: gestion-auditoire
    runtime: docker
    plan: free
    rootDir: .
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: Gestion des auditoires
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false # à remplacer par https://<votre-service>.onrender.com
      - key: APP_KEY
        sync: false # à générer puis coller ici (base64:...)
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-auditoire-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_LEVEL
        value: error
